services:
  db:
    build:
      context: .
      dockerfile: ops/db.Dockerfile
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: local_demo_only
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 2s
      timeout: 2s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgres://demo:local_demo_only@db:5432/demo
    depends_on:
      db:
        condition: service_healthy
  proxy:
    build:
      context: .
      dockerfile: ops/proxy.Dockerfile
    ports:
      - "${LAB_BIND:-127.0.0.1}:8080:8080"
    depends_on:
      - api
volumes:
  data:
